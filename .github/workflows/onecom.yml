name: one.com SFTP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Kontrollera anslutningen eller publicera hemsidan
        type: choice
        options: [inspect, deploy]
        default: inspect
        required: true

permissions:
  contents: read

concurrency:
  group: onecom-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: node --test scripts/onecom.test.mjs

  transfer:
    needs: validate
    # Automatic publishing stays off until the first manual deployment is verified.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ONECOM_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Installera SFTP-klient
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
      - name: Anslut till one.com
        env:
          ONECOM_OPERATION: ${{ inputs.operation || 'deploy' }}
          LFTP_PASSWORD: ${{ secrets.ONECOM_SFTP_PASSWORD }}
          ONECOM_KNOWN_HOSTS: ${{ secrets.ONECOM_KNOWN_HOSTS }}
          ONECOM_REMOTE_DIR: ${{ vars.ONECOM_REMOTE_DIR }}
        run: node scripts/onecom.mjs
